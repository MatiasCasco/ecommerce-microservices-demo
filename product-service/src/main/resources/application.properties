spring.application.name=product-service
server.servlet.context-path=/product-service
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5433/ecommerce_product_db
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Activar logs para saber si pool funciona
logging.level.com.zaxxer.hikari=INFO

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.org.springdoc=DEBUG
logging.level.org.springframework.web=DEBUG

jwt.secret="my-secret-key-my-secret-key-my-secret-key"
jwt.expiration=3600000