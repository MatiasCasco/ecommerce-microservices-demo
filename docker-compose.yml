version: '3.8'

services:

  user-db:
    image: postgres:15
    container_name: ecommerce-user
    environment:
      POSTGRES_DB: ecommerce_user_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - user-data:/var/lib/postgresql/data

  product-db:
    image: postgres:15
    container_name: ecommerce-product
    environment:
      POSTGRES_DB: ecommerce_product_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - product-data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: ecommerce-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ecommerce-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  user-data:
  product-data:
  mongo-data: